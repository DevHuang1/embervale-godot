[pytest]
# The API tests import the FastAPI app as `app.*` (needs `backend` on the
# path), while the security-contract tests read repo-root-relative paths such
# as `backend/app/main.py`. Only the repository root satisfies both, so pin
# the path and the test directory here and run `python3 -m pytest` from there.
pythonpath = backend
testpaths = backend/tests
